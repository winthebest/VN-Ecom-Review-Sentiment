model_variants:
  default:
    embedding_dim: 128
    num_filters: 100
    filter_sizes: [3, 4, 5]
    dropout: 0.3
    learning_rate: 0.001
    batch_size: 64
    epochs: 10
    patience: 3
    optimizer: "adam"
    loss_function: "cross_entropy"

  variant_1:
    embedding_dim: 256
    num_filters: 150
    filter_sizes: [3, 4, 5]
    dropout: 0.4
    learning_rate: 0.0005
    batch_size: 64
    epochs: 15
    patience: 4
    optimizer: "adam"
    loss_function: "cross_entropy"

  variant_2:
    embedding_dim: 512
    num_filters: 200
    filter_sizes: [2, 3, 4, 5]
    dropout: 0.5
    learning_rate: 0.0003
    batch_size: 32
    epochs: 20
    patience: 5
    optimizer: "adam"
    loss_function: "cross_entropy"
